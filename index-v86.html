<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinuxLab — Alpine Linux x86 Hardware VM</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="/libv86.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-group">
          <span style="font-size: 1.3rem;">🖥️</span>
          <span class="logo-title">LinuxLab <span class="badge" style="color: #4ade80; border-color: #4ade80;">Alpine x86 VM (Real Kernel)</span></span>
        </div>
        <div class="header-actions">
          <button id="btn-v86-restart" class="action-btn">↺ Reboot VM</button>
          <a href="./index.html" class="action-btn">🏠 Exit to Home</a>
        </div>
      </header>

      <main style="display: flex; flex: 1; height: calc(100vh - 55px); background: #020617; position: relative;">
        <!-- Terminal Container -->
        <div id="v86-terminal-container" style="flex: 1; width: 100%; height: 100%; padding: 12px;"></div>
        
        <!-- v86 Canvas Pipeline (Must exist and not be display: none) -->
        <div id="screen_container" style="position: absolute; left: -9999px; top: -9999px; width: 640px; height: 400px; visibility: hidden; pointer-events: none;">
          <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
          <canvas></canvas>
        </div>
      </main>
    </div>

    <script type="module">
      import { V86LinuxTerminal } from '/src/main-v86.ts';
      window.addEventListener('DOMContentLoaded', () => {
        const vm = new V86LinuxTerminal('v86-terminal-container');
        vm.boot();

        document.getElementById('btn-v86-restart')?.addEventListener('click', () => {
          vm.restart();
        });
      });
    </script>
  </body>
</html>
